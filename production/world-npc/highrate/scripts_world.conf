// --------------------------------------------------------------
// -            Per-world NPC list — DEFAULT (empty)            -
// --------------------------------------------------------------
// Fallback used by render-assets.sh for any world without its own
// production/world-npc/<id>/ directory. Loads nothing extra: such a world
// gets exactly what npc/scripts_custom.conf enables for everyone.
//
// To give world 'a' its own NPCs:
//
//   mkdir -p production/world-npc/a
//   cp production/world-npc/_default/scripts_world.conf production/world-npc/a/
//   $EDITOR production/world-npc/a/scripts_world.conf
//   ./render-assets.sh --env-file .env.world-a
//
// Only `npc:`, `delnpc:`, `import:` and `//` comments are valid here —
// map_reloadnpc_sub() warns "Unknown setting" for anything else.
//
// Paths are relative to /rathena (the server's working directory):
//
//   npc: npc/custom/etc/lottery.txt      enable a script that ships in the
//                                        image but is commented out in
//                                        npc/scripts_custom.conf
//
//   delnpc: npc/custom/etc/mvp_room.txt  drop a script that
//                                        npc/scripts_custom.conf enables for
//                                        every world
//
//   npc: conf/import/npc/my_npc.txt      a script that lives next to this
//                                        file, in production/world-npc/<id>/.
//                                        Editable on the host and picked up by
//                                        @reloadscript — no image rebuild,
//                                        unlike anything under npc/.
delnpc: npc/custom/warper.txt
npc: npc/nmeylan/warper.txt
