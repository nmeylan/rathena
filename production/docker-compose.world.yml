# One world = char-server + map-server + its own database, sharing the login
# stack's accounts. Parametrized by an env file so each world is a copy of a
# single .env.
#
# Start world A:  docker compose -f docker-compose.world.yml --env-file .env.world-a up -d
# Start world B:  docker compose -f docker-compose.world.yml --env-file .env.world-b up -d
#
# Required env vars (see .env.world-a.example):
#   WORLD       short id, e.g. a / b        -> container names + project name
#   CONFIG_DIR  ./asset-world-a             -> mounted at /rathena/conf/import
name: rathena-world-${WORLD}

x-server-common: &server-common
    image: "rathena:prod"          # built by the login stack; shared code
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    volumes:
        # Replaces /rathena/conf/import *entirely* — the image's own files there
        # (groups.yml, atcommands.yml, inter_server.yml, …) are invisible to this
        # world, so anything custom must be in CONFIG_DIR. Also carries this
        # world's npc/ subdir, which drives its NPC list; see SETUP.md
        # "Per-world NPCs". Everything in here is rendered by render-assets.sh.
        - "${CONFIG_DIR:?set CONFIG_DIR in the world env file}:/rathena/conf/import:ro"
        # Per-world db overrides: level cap, exp tables, stat points. This is the
        # last entry in every db Footer import chain, so it wins over db/ and
        # db/pre-re/. Rendered as CONFIG_DIR/db-import (seeded from
        # db/import-tmpl, so it does not shadow the image's copies) — run
        # render-assets.sh before `up`, or this mounts empty.
        - "${CONFIG_DIR}/db-import:/rathena/db/import:ro"
        # Shared scripts, straight from the host checkout — shadows the copy
        # baked in by `COPY . /rathena`. Editing anything under npc/ then needs
        # only `@reloadscript`, no image rebuild (which is a full ~3 GiB
        # skill.cpp recompile). Read-only: nothing under npc/ is written at
        # runtime — npc/barters.yml is load-only (src/map/npc.cpp:395), barter
        # stock persists to SQL.
        #   Trade-off: scripts now come from the working tree, not the image, so
        # `git pull` changes what the next reload loads and rolling the image
        # back does NOT roll scripts back. Keep the checkout on the commit the
        # image was built from unless you mean to diverge.
        - "${NPC_DIR:-../npc}:/rathena/npc:ro"
        - "log:/rathena/log"
    logging:
        driver: "json-file"
        options: { max-size: "20m", max-file: "5" }
    networks:
        - shared
    # No `ports:` — HAProxy publishes this world's char/map ports.

services:
    char:
        <<: *server-common
        container_name: "rathena-world-${WORLD}-char"
        command: ["/rathena/char-server"]

    map:
        <<: *server-common
        container_name: "rathena-world-${WORLD}-map"
        command: ["/rathena/map-server"]
        depends_on:
            - char

volumes:
    log:

# All containers live on the login stack's network so char can reach `login`
# and `db`, and HAProxy can reach char/map. Cross-world references use unique
# container names (rathena-world-a-char, …), so the duplicated `char`/`map`
# service aliases are never queried.
networks:
    shared:
        external: true
        name: rathena-nmey_default
