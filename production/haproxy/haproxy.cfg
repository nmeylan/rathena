global
    log stdout format raw local0 info
    maxconn 20000

# Docker's embedded DNS. Lets HAProxy re-resolve backend container names at
# runtime instead of only at startup, so it survives booting before the game
# servers and containers changing IPs on restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s

defaults
    mode    tcp
    log     global
    option  tcplog
    option  dontlognull
    timeout connect 5s
    # RO connections are long-lived; the client sends keepalive pings, so a
    # generous idle timeout is fine. Do not set this low or players drop.
    timeout client  1h
    timeout server  1h
    retries 3

#-----------------------------------------------------------------------
# Per-source-IP flood protection (ENABLED). rAthena doesn't speak the PROXY
# protocol, so the game servers see HAProxy as the source — HAProxy is the only
# place with the real client IP, so per-IP limits belong here.
#
# One shared table counts an IP across login + every world port together:
#   conn_cur          currently-open connections from that IP
#   conn_rate(10s)    new connections from that IP in the last 10 seconds
#
# Tunables — raise if legitimate players share one IP (households / net cafes),
# lower to clamp harder. Defaults are deliberately generous to avoid locking
# out shared IPs; a real flood is orders of magnitude above these.
#   MAX_CONN_CUR  = 50
#   MAX_CONN_RATE = 100  (per 10s)
#-----------------------------------------------------------------------
backend st_flood
    stick-table type ip size 100k expire 2m store conn_cur,conn_rate(10s)

# Reusable guard applied at the top of every frontend.
#   track-sc0 records the source IP into the shared table, then reject if it is
#   already over either limit.

#=======================================================================
# LOGIN — single, shared by every world
#=======================================================================
frontend login
    bind :6900
    tcp-request connection track-sc0 src table st_flood
    tcp-request connection reject if { sc0_conn_cur gt 50 }
    tcp-request connection reject if { sc0_conn_rate gt 100 }
    default_backend login_bk
backend login_bk
    server login rathena-login:6900 check resolvers docker init-addr last,libc,none

#=======================================================================
# WORLDS — one marker-delimited block per world, managed by ../new-world.sh.
# Do NOT edit inside the "# >>> world X" / "# <<< world X" markers; change the
# world's .env file and re-run new-world.sh. Blocks are appended below.
#=======================================================================
