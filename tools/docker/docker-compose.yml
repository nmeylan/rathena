name: rathena-nostlro

services:
    db:
        image: "mariadb:noble"
        container_name: "nostalro-rathena-db"
        command: --port=23306
        ports:
            - "23306:23306" # allow DB connections from host
        volumes:
            - "rathenadb:/var/lib/mysql" # save database to local disk
            - "../../sql-files/:/docker-entrypoint-initdb.d" # initialize db with ./sql-files
        environment:
            MYSQL_ROOT_PASSWORD: ragnarok
            MYSQL_DATABASE: ragnarok
            MYSQL_USER: ragnarok
            MYSQL_PASSWORD: ragnarok

    builder:
        image: "rathena:local"
        container_name: "nostalro-rathena-builder"
        command: "/rathena/tools/docker/builder.sh"
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/login_conf.txt:/rathena/conf/import/login_conf.txt" #localdev login server port
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt"   #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt"     #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            BUILDER_CONFIGURE: "--enable-packetver=20111102 --enable-prere=yes"

    login:
        image: "rathena:local"
        container_name: "nostalro-rathena-login"
        command: sh -c "/bin/wait-for db:23306 -- /rathena/login-server"
        ports:
            - "26900:26900" # login server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/login_conf.txt:/rathena/conf/import/login_conf.txt" #localdev login server port
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt"   #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt"     #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - db
    char:
        image: "rathena:local"
        container_name: "nostalro-rathena-char"
        command: sh -c "/bin/wait-for db:23306 -- /rathena/char-server"
        ports:
            - "26121:26121" # char server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/login_conf.txt:/rathena/conf/import/login_conf.txt" #localdev login server port
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt"   #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt"     #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - login
    map:
        image: "rathena:local"
        container_name: "nostalro-rathena-map"
        command: sh -c "/bin/wait-for db:23306 -- /rathena/map-server"
        ports:
            - "25121:25121" # map server
        volumes:
            - "../..:/rathena" # mount git repo directory inside container
            - "./asset/inter_conf.txt:/rathena/conf/import/inter_conf.txt" # load db connection
            - "./asset/login_conf.txt:/rathena/conf/import/login_conf.txt" #localdev login server port
            - "./asset/char_conf.txt:/rathena/conf/import/char_conf.txt"   #localdev login-char relation
            - "./asset/map_conf.txt:/rathena/conf/import/map_conf.txt"     #localdev char-map relation
        init: true # helps with signal forwarding and process reaping
        tty: true
        stdin_open: true
        build:
            context: .
            dockerfile: Dockerfile
        depends_on:
            - char

volumes:
    rathenadb:
